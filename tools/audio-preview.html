<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>键渊 · 音效切片台</title>
<style>
:root{color-scheme:dark;font:15px system-ui;color:#e3ddca;background:#0c1219}*{box-sizing:border-box}body{margin:0;padding:32px}h1{font-size:28px;letter-spacing:.1em}p{color:#9cacb5;line-height:1.6}header{display:flex;align-items:center;justify-content:space-between;gap:24px}main{display:grid;grid-template-columns:320px 1fr;gap:28px}aside{height:76vh;display:flex;flex-direction:column}input,button{font:inherit;color:inherit;border:1px solid #394958;background:#14202c;border-radius:5px;padding:10px}button{cursor:pointer}button:hover,button[aria-pressed=true]{border-color:#dabd76;background:#263343}#list{overflow:auto;margin-top:12px;display:grid;gap:6px}#list button{text-align:left;font-size:13px}#list small{display:block;color:#92a6b2;margin-top:4px}article{min-width:0}canvas{width:100%;height:200px;background:#101d28;border-radius:8px}#regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin:16px 0}.region{border:1px solid #344551;padding:12px;border-radius:6px}.region input{width:105px}.region label{font-size:12px;display:inline-flex;flex-direction:column;gap:5px;margin:8px 8px 8px 0}.region button{margin-right:8px}#description{min-height:50px}#status{color:#e1c78c;min-height:25px}audio{width:100%;margin:12px 0}code{font-size:12px;overflow-wrap:anywhere;color:#91afbd}nav{display:flex;gap:12px;flex-wrap:wrap}@media(max-width:800px){body{padding:16px}main{grid-template-columns:1fr}aside{height:240px}header{display:block}}
</style></head><body>
<header><div><h1>音效切片台</h1><p>搜索介绍 · 试听变体 · 校正边界。原始无损素材始终保留。</p></div><span id="summary"></span></header>
<main><aside><input id="search" aria-label="搜索音效" placeholder="分类、文件名或英文描述"><div id="list"></div></aside><article>
<h2 id="title">正在读取索引…</h2><code id="filename"></code><p id="description"></p>
<canvas id="wave" width="1200" height="200" aria-label="波形和切片边界"></canvas><audio id="player" controls preload="none"></audio>
<div id="regions"></div><nav><button id="add">新增切片</button><button id="save">保存切片标记</button><button id="reset">恢复自动检测</button></nav>
<p id="status" role="status"></p><p>边界单位为秒，编号从 0 开始。保存后运行 <code>npm run audio:build</code> 更新开发资源；正式构建会自动按引用导出。<br>首次试听会转换当前文件为浏览器兼容的 FLAC；游戏实际使用裁切后的 FLAC。</p>
</article></main><script type="module" src="./audio-preview.ts"></script></body></html>
