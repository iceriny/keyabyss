[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "typing-dynamics-research"
version = "1.0.0"
description = "Evidence-constrained hybrid simulation of visually guided typing"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.12", "pandas>=2.2", "matplotlib>=3.8", "numba>=0.61", "PyYAML>=6.0"]
[project.optional-dependencies]
dev = ["pytest>=8", "textblob==0.19.0", "cmudict==1.1.3"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
